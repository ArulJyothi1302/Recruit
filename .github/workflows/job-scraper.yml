name: Scheduled L2 Job Scraper & Mailer

on:
  schedule:
    # 11:00 AM IST = 05:30 UTC
    # Runs every 2 days
    - cron: '30 5 */2 * *'

  # Allows manual testing from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape-filter-and-email:

    runs-on: ubuntu-latest

    # Give the scraper enough time
    timeout-minutes: 60

    steps:

      # --------------------------------------------------
      # Checkout Repository
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --------------------------------------------------
      # Verify Node / NPM
      # --------------------------------------------------

      - name: Verify Runtime
        run: |
          node --version
          npm --version

      # --------------------------------------------------
      # Install Dependencies
      # --------------------------------------------------

      - name: Install Dependencies
        run: npm ci

      # --------------------------------------------------
      # Verify Required Secrets
      # --------------------------------------------------

      - name: Verify Secrets
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

        run: |
          if [ -z "$APIFY_API_TOKEN" ]; then
            echo "❌ APIFY_API_TOKEN is missing"
            exit 1
          fi

          if [ -z "$EMAIL_USER" ]; then
            echo "❌ EMAIL_USER is missing"
            exit 1
          fi

          if [ -z "$EMAIL_PASS" ]; then
            echo "❌ EMAIL_PASS is missing"
            exit 1
          fi

          echo "✅ Required secrets are configured"

      # --------------------------------------------------
      # Run Job Scraper
      # --------------------------------------------------

      - name: Run Job Scraper
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

        run: |
          echo "🚀 Starting L2 Job Scraper..."
          echo ""

          echo "UTC time:"
          date -u

          echo ""
          echo "IST time:"
          TZ=Asia/Kolkata date

          echo ""
          echo "🔎 Running scraper..."

          node scraper.js

      # --------------------------------------------------
      # Upload Excel Report
      # --------------------------------------------------

      - name: Archive Excel Report
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: Targeted_Job_List_${{ github.run_number }}

          path: |
            *.xlsx

          retention-days: 7

          if-no-files-found: warn